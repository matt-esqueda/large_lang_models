[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["legacy", ".venv", "data", "models", "logs"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: enforced by the formatter, not the linter
    "E741",  # ambiguous variable names (l, I, O) - present in legacy-derived code
]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gptlm"
version = "0.1.0"
description = "Character-level GPT language model"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gptlm = "gptlm.cli:main"
