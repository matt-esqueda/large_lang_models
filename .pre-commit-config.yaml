repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # data/ is excluded: rewriting the corpus changes the character
      # vocabulary and invalidates every checkpoint.
      - id: trailing-whitespace
        exclude: ^(legacy/|data/)
      - id: end-of-file-fixer
        exclude: ^(legacy/|data/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
