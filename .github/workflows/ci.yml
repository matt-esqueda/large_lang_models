name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Prepare data
        run: python scripts/prepare_data.py
      - name: Verify vocabulary invariant
        run: python .github/scripts/check_vocab.py
      - name: Train briefly
        run: gptlm train --batch-size 8 --max-iters 6 --eval-iters 2 --eval-interval 5 --checkpoint-interval 5 --block-size 16 --n-layer 2 --n-head 2 --n-embd 32
      - name: Reload checkpoint on CPU
        run: python .github/scripts/check_checkpoint.py
      - name: Resume briefly
        run: gptlm train --resume models/checkpoints/model_final.pt --max-iters 2 --batch-size 8 --eval-iters 2
      - name: Generate briefly
        run: gptlm chat --prompt "Dorothy" --max-new-tokens 20

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
