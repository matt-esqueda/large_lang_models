# Single source of default settings for every `gptlm` command.
# Command-line flags override these values; `--config PATH` selects a
# different file. Paths are relative to the directory you run from.
#
# Write exponents with a decimal point (3.0e-4): PyYAML follows YAML 1.1
# and reads 3e-4 as a string.

runtime:
  device: auto               # auto | cuda | cpu

data:
  tokenizer: char            # char (one token per character) | gpt2 (GPT-2 BPE, 50,257 tokens)
  raw_file: data/raw/wizard_of_oz.txt
  raw_url: null              # where prepare downloads raw_file from if it is missing
  raw_val_file: null         # separate validation text; null = split raw_file at train_split
  raw_val_url: null
  train_split: 0.9           # fraction of raw_file used for training
  document_separator: null   # text between documents in the raw files; null = one document
  dir: data/processed        # prepare writes train.bin, val.bin, meta.json (and vocab.txt)

model:
  n_embd: 384
  n_head: 6
  n_layer: 6
  block_size: 64             # context window, in characters
  dropout: 0.2

training:
  batch_size: 32
  max_iters: 5000
  learning_rate: 3.0e-4
  weight_decay: 0.1          # AdamW decay on matrix weights; biases and norms get none
  warmup_iters: 100          # linear warmup from 0 to learning_rate
  lr_decay_iters: null       # cosine decay to min_lr ends here; null = max_iters
  min_lr: 3.0e-5             # learning rate at and after lr_decay_iters
  grad_clip: 1.0             # clip the global gradient norm to this; null disables
  precision: auto            # auto | bf16 | fp32; auto = bf16 autocast on CUDA, fp32 on CPU
  compile: false             # torch.compile the model; slow first steps, faster after
  eval_iters: 100            # batches averaged per loss estimate
  eval_interval: 500         # estimate loss every N iterations
  checkpoint_interval: 500   # save a checkpoint every N iterations
  seed: null                 # set an integer for reproducible runs

generation:
  max_new_tokens: 150
  temperature: 1.0           # 0.0 = greedy
  top_k: null
  top_p: null
  repetition_penalty: 1.0

paths:
  checkpoint_dir: models/checkpoints
  log_dir: logs
