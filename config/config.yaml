# Single source of default settings for every `gptlm` command.
# Command-line flags override these values; `--config PATH` selects a
# different file. Paths are relative to the directory you run from.
#
# Write exponents with a decimal point (3.0e-4): PyYAML follows YAML 1.1
# and reads 3e-4 as a string.

runtime:
  device: auto               # auto | cuda | cpu

data:
  raw_file: data/raw/wizard_of_oz.txt
  train_file: data/processed/train_split.txt
  val_file: data/processed/val_split.txt
  vocab_file: data/processed/vocab.txt
  train_split: 0.9           # fraction of the corpus used for training

model:
  n_embd: 384
  n_head: 6
  n_layer: 6
  block_size: 64             # context window, in characters
  dropout: 0.2

training:
  batch_size: 32
  max_iters: 5000
  learning_rate: 3.0e-4
  eval_iters: 100            # batches averaged per loss estimate
  eval_interval: 500         # estimate loss every N iterations
  checkpoint_interval: 500   # save a checkpoint every N iterations
  seed: null                 # set an integer for reproducible runs

generation:
  max_new_tokens: 150
  temperature: 1.0           # 0.0 = greedy
  top_k: null
  top_p: null
  repetition_penalty: 1.0

paths:
  checkpoint_dir: models/checkpoints
  log_dir: logs
